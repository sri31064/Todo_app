<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f9" />
    <title>My Tasks</title>
    <script>
      // Set the theme before paint so a saved dark preference never flashes light.
      (function () {
        try {
          var saved = localStorage.getItem('taskspace-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0f1117' : '#f3f4f9');
        } catch (e) {
          /* Storage or matchMedia unavailable: React will apply a theme shortly. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
